# Nginx na frente do gunicorn (EC2/VM). Ajuste server_name e caminhos.
upstream isf_app { server 127.0.0.1:8000; }

server {
    listen 80;
    server_name catalogo.exemplo.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name catalogo.exemplo.com.br;

    ssl_certificate     /etc/letsencrypt/live/catalogo.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalogo.exemplo.com.br/privkey.pem;

    client_max_body_size 20m;   # importação de planilha e imagens pelo admin

    # Mídia (uploads do admin e miniaturas). Com USE_S3=True este bloco não é necessário.
    location /media/ {
        alias /srv/isf/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Estáticos são servidos pelo WhiteNoise (hash + compressão); o Nginx só repassa.
    location / {
        proxy_pass http://isf_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
