; /etc/supervisor/conf.d/isf.conf — mesmo modelo do projeto interno (EC2 + supervisor + gunicorn)
[program:isf]
directory=/srv/isf/app
command=/srv/isf/app/.venv/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 3 --access-logfile -
environment=DJANGO_SETTINGS_MODULE="config.settings.prod"
user=isf
autostart=true
autorestart=true
stopsignal=TERM
stdout_logfile=/var/log/isf/app.log
redirect_stderr=true
