<div class="faq__lista">
  {% for f in perguntas %}
    <details class="faq__item" {% if forloop.first %}open{% endif %}>
      <summary><span>{{ f.question }}</span><span class="faq__icone" aria-hidden="true">{% icone "plus" 16 %}</span></summary>
      <div class="faq__resposta">{{ f.answer|linebreaks }}</div>
    </details>
  {% endfor %}
</div>
