# Sobe tudo com: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: isf
      POSTGRES_USER: isf
      POSTGRES_PASSWORD: isf-local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isf -d isf"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://isf:isf-local@db:5432/isf
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      SECURE_SSL_REDIRECT: "False"
      LOAD_DEMO_DATA: ${LOAD_DEMO_DATA:-True}
      # Valores fixos para o ambiente local em HTTP (o .env também é usado na interpolação do compose).
      # Em produção, use docs/deploy.md: HTTPS, SECURE_COOKIES=True e mídia no Nginx ou S3.
      SERVE_MEDIA: "True"
      SECURE_COOKIES: "False"
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
